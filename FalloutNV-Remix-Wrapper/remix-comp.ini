; remix-comp configuration — Fallout: New Vegas
; Ported from FNV_proxy to remix-comp framework

; ============================================================
; Remix Bridge
;
; When Enabled=1, the d3d9.dll proxy LoadLibrary's the named DLL
; and forwards Direct3DCreate9/Ex through it. Set Enabled=0 to
; bypass Remix entirely and just forward to system d3d9.dll.
;
; DLLName should be the RTX Remix bridge d3d9.dll renamed so it
; doesn't collide with this proxy. Place it next to d3d9.dll in
; the game directory.
; ============================================================
[Remix]
Enabled=1
DLLName=d3d9_remix.dll

[Chain]
; Semicolon-separated list of DLLs/ASIs to load before the d3d9 chain is established.
; Example: Preload=dinput8.dll;some_other_mod.asi
Preload=

; Semicolon-separated list of DLLs/ASIs to load after the game window appears.
Postload=

; ============================================================
; FFP Conversion Settings
; ============================================================
[FFP]
Enabled=1
AlbedoStage=0
; Per-decl-shape overrides — edit these between launches to tune.
; Stage values are 0-7 (which texture stage holds the diffuse for that mesh class).
; NOTE (2026-07-26): TerrainAlbedoStage is a DEAD KNOB for any shader the PS
; classifier gives a Diffuse role -- which is every FNV terrain shader (they all
; report diff=s0). apply_ps_protocol runs after setup_albedo_texture and rebinds
; slot 0 back to the classifier's diffuse slot, so 0, 1 and 3 all end up at
; BaseMap layer 0. The old "revert to 3 after the test" note below is obsolete;
; changing this value will not affect terrain. Real fix = MultiLayerTerrain.
TerrainAlbedoStage=0
BIAlbedoStage=1

; Route distant-terrain LOD shaders through FFP instead of passthrough+Ignore.
;   1 = LOD terrain is path-traced and drops the passthrough perf tax. s0 is an
;       atlas the game's PS does UV math on, so watch for atlas-tiling on distant
;       terrain; if it smears, this is the knob to flip back off (no rebuild).
;   0 = legacy passthrough (game's own PS rasterises LOD, path tracer ignores it).
RouteLodToFfp=1

; Route FNV's WATER shader family through FFP instead of passthrough+Ignore.
; Water's pixel shaders declare ReflectionMap / RefractionMap / NoiseMap /
; DepthMap / DisplacementMap and NO BaseMap/DiffuseMap/TexMap, so without this
; they fail the diffuse-role gate, get tagged Ignore, and the path tracer skips
; them entirely — water is simply absent from the image.
;   1 = water is FFP-converted and path-traced. Its NoiseMap becomes the albedo
;       (water's only non-render-target texture, so the only one that hashes
;       stably), and the draw is tagged AnimatedWater.
;   0 = legacy passthrough+Ignore (water invisible).
; Note: this makes water VISIBLE, not yet translucent — FFP rasterises it as an
; opaque plane. For real water, key a translucent material replacement on the
; NoiseMap hash in the Remix Toolkit. Toggle live in the ImGui FFP tab.
RouteWaterToFfp=1

; Force water's FFP surface opaque instead of taking alpha from the NoiseMap.
; That texture's alpha channel carries nothing meaningful, and reading opacity
; from it can resolve the whole water surface to ~zero alpha — which looks
; IDENTICAL to water being missing. Also tags IgnoreAlphaChannel so Remix
; doesn't re-derive the same near-zero opacity on its own side.
;   1 = opaque (default; what makes water actually appear)
;   0 = alpha straight from the NoiseMap (diagnostic — use to confirm whether
;       alpha was the culprit)
; Live A/B: F4 overlay -> FFP tab -> "Water Force Opaque".
WaterForceOpaque=1

; LOD sink: the game's LOD vertex shader lowers coarse terrain LOD where real
; cells are loaded so it tucks under the detailed terrain. FFP can't do that
; per-vertex, so we drop the whole draw's world-Z to approximate it.
;   -1 = AUTO: match the engine's own GeomorphParams.y each draw (recommended)
;    0 = off (coarse LOD will poke through loaded terrain)
;   >0 = fixed sink in world units (manual tuning; raise if it still pokes)
; Engine's own value (AUTO) is ~230. Lower = less terrain drop while cells stream
; in, at the cost of a little more steady-state poke-through. Tune to taste.
; 2 = per-vertex sink replicating SLS2002.vso exactly (default, recommended)
; 1 = legacy uniform world-matrix sink by LodSinkZ (z-fights inside the loaded
;     rectangle AND over-sinks outside it -- no LodSinkZ value fixes both)
; 0 = off
; Live A/B without a relaunch: F4 overlay -> FFP tab -> "LOD Sink".
LodSinkMode=2

; Uniform sink distance, mode 1 only. -1 = AUTO (engine GeomorphParams.y, ~230).
LodSinkZ=120

; Multi-layer terrain. FNV blends up to 7 ground layers; the normal FFP path can
; only pick one, so blended terrain renders flat. The .trex runtime shipped with
; v0.0.4 DOES decode this, so it is safe to turn on -- but it is off by default
; because a seam is still visible at cell boundaries. If you swap in a different
; Remix runtime that lacks the decode, set this back to 0: on such a build the
; payload routes NO textures at all, which is worse than flat layer 0.
MultiLayerTerrain=0

; Near land LOD (PS 0x6626FACE, VS SLS2080). CONFIRMED source of the distant
; terrain z-fight: passthrough + Ignore means it is RASTERISED only and fights
; the path-traced terrain. Its own VS fades it to alpha 0 within ~6964 units of
; the blend centre, so near the player it contributes nothing but the artifact.
;   1 = drop entirely (default, fixes the z-fight)
;   0 = passthrough (legacy)
; Live toggle: F7, works with the overlay closed.
NearLodMode=1


; ============================================================
; Skinning
;
; FNV uses game-specific skinning (declaration cloning + engine hooks)
; instead of the generic skinning module. Keep this OFF.
; ============================================================
[Skinning]
Enabled=1

; ============================================================
; Culling Patch (Wall_SoGB's disable-culling patch, ported from NewVegasRTXHelper)
;
; When Enabled=1, this patch DISABLES the game's culling pass:
; BSCullingProcess visits every NiAVObject instead of frustum/portal-
; rejecting them. That lets RTX Remix see off-screen geometry so
; reflections, GI, and shadow rays work correctly.
;
; Writes to fixed FNV addresses (0x8743A6 + 0x101E330) — only enable
; on the standard Steam/GOG executable. No effect (other than perf
; cost) if Remix isn't loaded.
; ============================================================
[CullingPatch]
Enabled=0

; ============================================================
; Point Light Extraction
;
; Reads ShadowSceneNode point lights and submits via D3D9
; SetLight/LightEnable. RTX Remix intercepts for path tracing.
; ============================================================
[Lights]
Enabled=1
IntensityPercent=100

; Range mode:
;   0 = Use NiLight Spec.r directly (actual range value)
;   1 = Calculate from attenuation equation (1/255 falloff)
;   2 = INFINITY (let Remix determine range)
RangeMode=0

; ============================================================
; Diagnostic Logging
; ============================================================
[Diagnostics]
Enabled=0
DelayMs=300000
LogFrames=3

; ============================================================
; Frame Tracer
; ============================================================
[Tracer]
BacktraceDepth=8
OutputDir=captures

; ============================================================
; Sun / Moon time-of-day passthrough
;
; Each frame, reads the engine's sun/moon scene-graph orientation
; and pushes it to Remix via rtx.atmosphere.sun*/moon0.* config vars.
; Set Enabled=0 to leave Remix's atmosphere using its own defaults.
; ============================================================
[SunCycle]
Enabled=1

[MoonCycle]
Enabled=1
